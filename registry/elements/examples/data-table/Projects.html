<!-- A studio's projects on sample data: filter by discipline and status, sort by weeks, hours or screens, five to a
     page. -->
<div class="min-h-110 w-full">
  <agd-data-table id="studio-projects" row-key="id" label="Projects"></agd-data-table>
</div>
<script type="module">
  const formats = ['Product design', 'Branding', 'Development']
  const statuses = ['In progress', 'Shipped']
  const names = ['onboarding', 'dashboard', 'brand system', 'website', 'mobile app', 'billing', 'design system', 'help center']
  const table = document.getElementById('studio-projects')
  table.rows = Array.from({ length: 17 }, (_, i) => ({
    id: `p-${i + 1}`,
    name: `Acme ${names[i % names.length]}${i >= names.length ? ` ${Math.floor(i / names.length) + 1}` : ''}`,
    format: formats[i % 3],
    status: statuses[i % 4 === 3 ? 1 : 0],
    days: ((i * 17) % 20) + 2,
    hours: ((i * 37) % 160) + 12,
    screens: ((i * 13) % 48) + 6,
  }))
  table.columns = [
    { key: 'name', label: 'Project', sortable: true },
    { key: 'format', label: 'Discipline' },
    { key: 'status', label: 'Status', muted: true },
    { key: 'days', label: 'Weeks', align: 'right', sortable: true },
    { key: 'hours', label: 'Hours', align: 'right', sortable: true },
    { key: 'screens', label: 'Screens', align: 'right', sortable: true },
  ]
  table.filters = [{ key: 'format', label: 'Discipline', options: formats }, { key: 'status', label: 'Status', options: statuses }]
  table.cells = { hours: ({ value }) => `${value} h` }
</script>
