<!-- Filters over a grid of projects: each stays on until pressed again. -->
<div class="flex flex-wrap items-center gap-2">
  <agd-toggle pressed><i data-lucide="play" data-size="16" data-stroke-width="1.5" aria-hidden="true"></i>Product</agd-toggle>
  <agd-toggle><i data-lucide="grid-2x2" data-size="16" data-stroke-width="1.5" aria-hidden="true"></i>Brand</agd-toggle>
  <agd-toggle variant="outline" icon aria-label="Saved only"><i data-lucide="bookmark" data-size="16" data-stroke-width="1.5" aria-hidden="true"></i></agd-toggle>
  <agd-toggle variant="outline" disabled>Hardware</agd-toggle>
</div>
