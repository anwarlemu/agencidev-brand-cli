<!-- A note with the action that goes with it, and a problem in red with the fix. -->
<div class="flex w-160 max-w-full flex-col gap-3">
  <agd-alert alert-role="status" heading="Your next review is on Thursday.">
    <i data-lucide="info" data-size="16" data-stroke-width="1.5" slot="icon"></i>
    Bring the questions the team should answer first.
    <agd-button slot="action" size="sm">Add to calendar</agd-button>
  </agd-alert>
  <agd-alert variant="destructive" heading="Your payment did not go through.">
    <i data-lucide="circle-alert" data-size="16" data-stroke-width="1.5" slot="icon"></i>
    Update your card to keep Acme's projects open.
    <agd-button slot="action" size="sm" variant="secondary">Update card</agd-button>
  </agd-alert>
  <agd-alert alert-role="status" heading="Previews update with every commit.">
    <i data-lucide="info" data-size="16" data-stroke-width="1.5" slot="icon"></i>
  </agd-alert>
</div>
