<div class="flex flex-wrap items-center gap-3">
  <agd-button disabled>Book a call</agd-button>
  <agd-button variant="secondary" disabled>See the work</agd-button>
  <agd-button href="#work" variant="secondary">Read the case study <i data-lucide="arrow-up-right" data-size="16" data-stroke-width="1.5" aria-hidden="true"></i></agd-button>
</div>
