<!-- Press Share: a note rises in the corner, with Undo. Press it quickly and they stack, three at most; point at the
     stack to spread it out and hold their time. -->
<div class="flex min-h-72 flex-wrap items-start justify-center gap-2">
  <agd-button id="sonner-save">Share</agd-button>
  <agd-button id="sonner-track" variant="secondary">Send enquiry</agd-button>
  <agd-sonner id="sonner"></agd-sonner>
</div>
<script type="module">
  const sonner = document.getElementById('sonner')
  let count = 23
  document.getElementById('sonner-save').addEventListener('click', () => {
    count += 1
    sonner.toast('Shared', { description: `Acme onboarding is open to ${count} people.`, action: { label: 'Undo' } })
  })
  document.getElementById('sonner-track').addEventListener('click', () => {
    sonner.toast('Enquiry sent', { description: 'We reply within a day.' })
  })
</script>
