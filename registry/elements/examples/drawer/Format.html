<!-- A choice on a phone, from the bottom edge: which discipline to show. The rows are 44px to land a thumb on. -->
<div class="flex min-h-72 items-center justify-center">
  <agd-button id="format-open" variant="secondary"><i data-lucide="sliders-horizontal" data-size="16" data-stroke-width="1.5" aria-hidden="true"></i><span id="format-current">All disciplines</span></agd-button>
  <agd-drawer id="format-drawer" heading="Format" description="Show one discipline, or all of them.">
    <ul class="flex flex-col gap-1">
      <li><button type="button" aria-pressed="true" data-autofocus data-discipline="All disciplines" class="flex h-11 w-full cursor-pointer items-center gap-3 rounded-ds-sm px-3 text-left type-body text-fg outline-none transition-[background-color] duration-150 ease-standard hover:bg-ds-neutral-4 focus-visible:bg-ds-neutral-4"><span class="min-w-0 flex-1">All disciplines</span><span data-check class="contents"><i data-lucide="check" data-size="16" data-stroke-width="1.5" aria-hidden="true"></i></span></button></li>
      <li><button type="button" aria-pressed="false" data-discipline="Product design" class="flex h-11 w-full cursor-pointer items-center gap-3 rounded-ds-sm px-3 text-left type-body text-fg outline-none transition-[background-color] duration-150 ease-standard hover:bg-ds-neutral-4 focus-visible:bg-ds-neutral-4"><span class="min-w-0 flex-1">Product design</span><span data-check hidden class="contents"><i data-lucide="check" data-size="16" data-stroke-width="1.5" aria-hidden="true"></i></span></button></li>
      <li><button type="button" aria-pressed="false" data-discipline="Branding" class="flex h-11 w-full cursor-pointer items-center gap-3 rounded-ds-sm px-3 text-left type-body text-fg outline-none transition-[background-color] duration-150 ease-standard hover:bg-ds-neutral-4 focus-visible:bg-ds-neutral-4"><span class="min-w-0 flex-1">Branding</span><span data-check hidden class="contents"><i data-lucide="check" data-size="16" data-stroke-width="1.5" aria-hidden="true"></i></span></button></li>
      <li><button type="button" aria-pressed="false" data-discipline="Strategy" class="flex h-11 w-full cursor-pointer items-center gap-3 rounded-ds-sm px-3 text-left type-body text-fg outline-none transition-[background-color] duration-150 ease-standard hover:bg-ds-neutral-4 focus-visible:bg-ds-neutral-4"><span class="min-w-0 flex-1">Strategy</span><span data-check hidden class="contents"><i data-lucide="check" data-size="16" data-stroke-width="1.5" aria-hidden="true"></i></span></button></li>
      <li><button type="button" aria-pressed="false" data-discipline="Development" class="flex h-11 w-full cursor-pointer items-center gap-3 rounded-ds-sm px-3 text-left type-body text-fg outline-none transition-[background-color] duration-150 ease-standard hover:bg-ds-neutral-4 focus-visible:bg-ds-neutral-4"><span class="min-w-0 flex-1">Development</span><span data-check hidden class="contents"><i data-lucide="check" data-size="16" data-stroke-width="1.5" aria-hidden="true"></i></span></button></li>
    </ul>
  </agd-drawer>
</div>
<script type="module">
  const drawer = document.getElementById('format-drawer')
  document.getElementById('format-open').addEventListener('click', () => { drawer.open = true })
  for (const b of drawer.querySelectorAll('[data-discipline]')) {
    b.addEventListener('click', () => {
      for (const o of drawer.querySelectorAll('[data-discipline]')) {
        const on = o === b
        o.setAttribute('aria-pressed', String(on))
        o.toggleAttribute('data-autofocus', on)
        o.querySelector('[data-check]').hidden = !on
      }
      document.getElementById('format-current').textContent = b.dataset.discipline
      drawer.close()
    })
  }
</script>
