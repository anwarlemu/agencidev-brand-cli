<!-- A project list's filters in a sheet at the right edge: two fields and the buttons at the foot. Escape, Close or the
     dimmed page closes it. -->
<div class="flex min-h-40 items-center justify-center">
  <agd-button id="filters-open" variant="secondary"><i data-lucide="sliders-horizontal" data-size="16" data-stroke-width="1.5" aria-hidden="true"></i>Filters</agd-button>
  <agd-sheet id="filters-sheet" heading="Filter projects" description="Narrow the list to one client and how long the work ran.">
    <div class="flex flex-col gap-6">
      <div class="flex flex-col gap-2">
        <label for="sheet-client" class="type-label text-fg-soft">Client</label>
        <agd-input id="sheet-client" name="client" value="Acme" aria-label="Client"></agd-input>
      </div>
      <div class="flex flex-col gap-2">
        <label for="sheet-days" class="type-label text-fg-soft">Longer than</label>
        <agd-input id="sheet-days" name="days" value="4 weeks" aria-label="Longer than"></agd-input>
        <p class="type-caption text-fg-muted">Counts from the kickoff call.</p>
      </div>
    </div>
    <agd-button slot="foot" variant="ghost" data-close>Reset</agd-button>
    <agd-button slot="foot" data-close>Show results</agd-button>
  </agd-sheet>
</div>
<script type="module">
  const sheet = document.getElementById('filters-sheet')
  document.getElementById('filters-open').addEventListener('click', () => { sheet.open = true })
  for (const b of sheet.querySelectorAll('[data-close]')) b.addEventListener('click', () => { sheet.open = false })
</script>
