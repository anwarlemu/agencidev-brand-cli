<!-- The three sizes, matching the input's, and one that says what is wrong. -->
<div class="flex w-80 max-w-full flex-col gap-3">
  <agd-input-group size="sm" aria-label="Search, small" placeholder="Search"><i data-lucide="search" data-size="16" data-stroke-width="1.5" slot="start" aria-hidden="true"></i></agd-input-group>
  <agd-input-group size="md" aria-label="Search, medium" placeholder="Search"><i data-lucide="search" data-size="16" data-stroke-width="1.5" slot="start" aria-hidden="true"></i></agd-input-group>
  <agd-input-group size="lg" aria-label="Search, large" placeholder="Search"><i data-lucide="search" data-size="16" data-stroke-width="1.5" slot="start" aria-hidden="true"></i></agd-input-group>
  <agd-input-group aria-label="Project link, taken" value="acme" invalid><span slot="start">acme.com/p/</span></agd-input-group>
</div>
