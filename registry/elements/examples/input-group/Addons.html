<!-- An icon, a prefix, a unit and a button, each inside the field's hairline. -->
<div class="flex w-96 max-w-full flex-col gap-4">
  <agd-input-group aria-label="Search projects" placeholder="Search projects"><i data-lucide="search" data-size="16" data-stroke-width="1.5" slot="start" aria-hidden="true"></i></agd-input-group>
  <agd-input-group aria-label="Project link" value="acme-onboarding"><span slot="start">acme.com/p/</span></agd-input-group>
  <agd-input-group aria-label="Hours per week" type="number" value="20"><span slot="start">$</span><span slot="end">per month</span></agd-input-group>
  <agd-input-group aria-label="Invite by email" type="email" placeholder="name@acme.com"><agd-button slot="end" variant="secondary" size="sm">Invite</agd-button></agd-input-group>
</div>
