<!-- Labels over the fields they name, one with a note that it can stay empty. -->
<div class="flex w-80 max-w-full flex-col gap-6">
  <div class="flex flex-col gap-2">
    <agd-label for="label-email">Work email</agd-label>
    <agd-input id="label-email" type="email" placeholder="you@acme.com"></agd-input>
  </div>
  <div class="flex flex-col gap-2">
    <agd-label for="label-team" hint="Optional">Team name</agd-label>
    <agd-input id="label-team" placeholder="Acme growth"></agd-input>
  </div>
</div>
