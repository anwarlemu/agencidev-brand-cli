<!-- The app's rail: the logo and the fold button at the top, a label over each group, the page you are on in white,
     and the account at the foot. Fold it to icons with the button. -->
<div class="flex h-120 overflow-hidden rounded-container border border-edge">
  <agd-sidebar id="app-rail" label="App" collapsible>
    <agd-logo slot="head" height="20"></agd-logo>
    <agd-sidebar-label>Studio</agd-sidebar-label>
    <agd-sidebar-link href="#" active><i data-lucide="search" slot="icon" data-size="16" data-stroke-width="1.5" aria-hidden="true"></i>Search</agd-sidebar-link>
    <agd-sidebar-link href="#"><i data-lucide="compass" slot="icon" data-size="16" data-stroke-width="1.5" aria-hidden="true"></i>Work</agd-sidebar-link>
    <agd-sidebar-link href="#" status="12"><i data-lucide="store" slot="icon" data-size="16" data-stroke-width="1.5" aria-hidden="true"></i>Clients</agd-sidebar-link>
    <agd-sidebar-link href="#" status="8"><i data-lucide="users" slot="icon" data-size="16" data-stroke-width="1.5" aria-hidden="true"></i>Team</agd-sidebar-link>
    <agd-sidebar-label>Projects</agd-sidebar-label>
    <agd-sidebar-link href="#" status="24"><i data-lucide="folder" slot="icon" data-size="16" data-stroke-width="1.5" aria-hidden="true"></i>Acme onboarding</agd-sidebar-link>
    <agd-sidebar-link href="#" status="9"><i data-lucide="folder" slot="icon" data-size="16" data-stroke-width="1.5" aria-hidden="true"></i>Acme dashboard</agd-sidebar-link>
    <agd-sidebar-link href="#"><i data-lucide="bookmark" slot="icon" data-size="16" data-stroke-width="1.5" aria-hidden="true"></i>Saved</agd-sidebar-link>
    <div slot="foot" class="flex flex-col gap-0.5">
      <agd-sidebar-link href="#" data-static><i data-lucide="settings" slot="icon" data-size="16" data-stroke-width="1.5" aria-hidden="true"></i>Settings</agd-sidebar-link>
      <div class="flex flex-col px-3 pt-2">
        <span class="type-ui-strong text-fg">Acme</span>
        <span class="type-caption text-fg-muted">Monthly partnership</span>
      </div>
    </div>
  </agd-sidebar>
  <div class="hidden min-w-0 flex-1 flex-col gap-2 p-8 md:flex">
    <h2 id="app-page" class="type-heading-3 text-fg">Search</h2>
    <p class="type-ui text-fg-muted">Product design thinking and implementation.</p>
  </div>
</div>
<script type="module">
  const rail = document.getElementById('app-rail')
  const links = rail.querySelectorAll('agd-sidebar-link:not([data-static])')
  for (const link of rail.querySelectorAll('agd-sidebar-link')) {
    link.addEventListener('click', (event) => {
      event.preventDefault()
      if (link.hasAttribute('data-static')) return
      for (const l of links) l.active = l === link
      document.getElementById('app-page').textContent = link.textContent.trim()
    })
  }
</script>
