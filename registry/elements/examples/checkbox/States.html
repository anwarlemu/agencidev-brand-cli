<!-- Off, on, with a hint, invalid until it is checked, and disabled. -->

  <agd-checkbox label="Email me when a saved search finds new creatives"></agd-checkbox>

  <agd-checkbox label="Audio ads" hint="Coming soon." disabled></agd-checkbox>
</div>
