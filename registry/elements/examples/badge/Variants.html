<!-- The four variants, and the dots a state takes. -->
<div class="flex flex-col items-center gap-4">
  <div class="flex flex-wrap items-center justify-center gap-2">
    <agd-badge>All</agd-badge>
    <agd-badge variant="secondary">Design</agd-badge>
    <agd-badge variant="outline">Engineering</agd-badge>
    <agd-badge variant="destructive">Closed</agd-badge>
  </div>
  <div class="flex flex-wrap items-center justify-center gap-2">
    <agd-badge variant="outline" dot="on">Live</agd-badge>
    <agd-badge variant="outline" dot="off">Draft</agd-badge>
  </div>
</div>
