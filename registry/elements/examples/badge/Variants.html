<!-- The four variants, and the dots a creative's status takes. -->
<div class="flex flex-col items-center gap-4">
  <div class="flex flex-wrap items-center justify-center gap-2">
    <agd-badge>New</agd-badge>
    <agd-badge variant="secondary">Video</agd-badge>
    <agd-badge variant="outline">Carousel</agd-badge>
    <agd-badge variant="destructive">Paused</agd-badge>
  </div>
  <div class="flex flex-wrap items-center justify-center gap-2">
    <agd-badge variant="outline" dot="green">Running</agd-badge>
    <agd-badge variant="outline" dot="yellow">Testing</agd-badge>
    <agd-badge variant="outline" dot="red">Ended</agd-badge>
  </div>
</div>
