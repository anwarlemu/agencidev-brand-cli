<!-- The command menu on the page: type to filter, arrows to move, Enter to run. The line under says what ran. -->
<div class="flex w-120 max-w-full flex-col gap-3">
  <agd-command id="command-menu" label="Commands" placeholder="Type a command or search" groups='[{"heading":"Go to","items":[{"id":"search","label":"Search projects","shortcut":"/"},{"id":"enquiry","label":"New enquiry","keywords":["client","lead"]},{"id":"projects","label":"Projects"}]},{"heading":"Projects","items":[{"id":"onboarding","label":"Acme onboarding"},{"id":"dashboard","label":"Acme dashboard"}]},{"heading":"Settings","items":[{"id":"billing","label":"Billing","keywords":["plan","invoice"],"shortcut":"⌘B"},{"id":"team","label":"Team","disabled":true}]}]'>
    <span slot="icon-search" class="contents"><i data-lucide="search" data-size="16" data-stroke-width="1.5"></i></span>
    <span slot="icon-enquiry" class="contents"><i data-lucide="building-2" data-size="16" data-stroke-width="1.5"></i></span>
    <span slot="icon-projects" class="contents"><i data-lucide="bookmark" data-size="16" data-stroke-width="1.5"></i></span>
    <span slot="icon-billing" class="contents"><i data-lucide="credit-card" data-size="16" data-stroke-width="1.5"></i></span>
    <span slot="icon-team" class="contents"><i data-lucide="users" data-size="16" data-stroke-width="1.5"></i></span>
  </agd-command>
  <p id="command-menu-ran" class="type-caption text-fg-muted" aria-live="polite">Team needs an admin.</p>
</div>
<script type="module">
  document.getElementById('command-menu').addEventListener('select', (e) => {
    document.getElementById('command-menu-ran').textContent = `Ran: ${e.detail.label}.`
  })
</script>
