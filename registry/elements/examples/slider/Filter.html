<!-- A filter over a search: only projects longer than this many weeks, the count beside it. -->
<div class="flex w-96 max-w-full flex-col gap-2">
  <div class="flex items-baseline justify-between gap-4">
    <p class="type-label text-fg-soft">Longer than</p>
    <p id="slider-days" class="type-ui text-fg tabular-nums">6 weeks</p>
  </div>
  <agd-slider id="slider-filter" label="Longer than" min="0" max="26" value="6" value-text="6 weeks"></agd-slider>
  <p class="type-caption text-fg-muted">Counts from the kickoff call.</p>
</div>
<script type="module">
  const slider = document.getElementById('slider-filter')
  const out = document.getElementById('slider-days')
  slider.addEventListener('input', () => {
    out.textContent = `${slider.value} weeks`
    slider.valueText = `${slider.value} weeks`
  })
</script>
