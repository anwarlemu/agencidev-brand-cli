<!-- Notification settings: each row says what the switch does, one on, one off, and one the workspace locks. -->
<div class="flex w-120 max-w-full flex-col divide-y divide-edge rounded-container bg-surface-raised px-6">
  <div class="flex items-center justify-between gap-6 py-4">
    <div class="flex min-w-0 flex-col gap-1">
      <p class="type-ui-strong text-fg">Weekly digest</p>
      <p class="type-caption text-fg-muted">What shipped and what's next, every Monday.</p>
    </div>
    <agd-switch label="Weekly digest" checked></agd-switch>
  </div>
  <div class="flex items-center justify-between gap-6 py-4">
    <div class="flex min-w-0 flex-col gap-1">
      <p class="type-ui-strong text-fg">Preview alerts</p>
      <p class="type-caption text-fg-muted">An email when a new preview is ready.</p>
    </div>
    <agd-switch label="Preview alerts"></agd-switch>
  </div>
  <div class="flex items-center justify-between gap-6 py-4">
    <div class="flex min-w-0 flex-col gap-1">
      <p class="type-ui-strong text-fg">Share outside Acme</p>
      <p class="type-caption text-fg-muted">Turned off by the workspace owner.</p>
    </div>
    <agd-switch label="Share outside Acme" disabled></agd-switch>
  </div>
</div>
