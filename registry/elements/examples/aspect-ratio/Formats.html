<!-- The brand's three canvases holding their shape at any width: a 1:1 post, a 4:5 story and a 16:9 slide, each on the
     no-signal static. -->
<div class="grid w-200 max-w-full grid-cols-3 items-end gap-4 max-sm:grid-cols-1">
  <agd-aspect-ratio ratio="1" class="bg-surface-raised">
    <agd-no-signal still class="absolute inset-0"></agd-no-signal>
    <span class="absolute bottom-3 left-3 type-label text-fg">Post 1:1</span>
  </agd-aspect-ratio>
  <agd-aspect-ratio ratio="0.8" class="bg-surface-raised">
    <agd-no-signal still class="absolute inset-0"></agd-no-signal>
    <span class="absolute bottom-3 left-3 type-label text-fg">Story 4:5</span>
  </agd-aspect-ratio>
  <agd-aspect-ratio ratio="1.7777777777777777" class="bg-surface-raised">
    <agd-no-signal still class="absolute inset-0"></agd-no-signal>
    <span class="absolute bottom-3 left-3 type-label text-fg">Slide 16:9</span>
  </agd-aspect-ratio>
</div>
