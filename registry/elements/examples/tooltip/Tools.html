<!-- A screen's tools as icon buttons, each named by its tooltip. Point at one and wait, then move along: the next
     shows at once. Tab to one and its name shows without a wait. -->
<div class="flex min-h-24 items-start justify-center gap-1">
  <agd-tooltip text="Share"><agd-button variant="ghost" icon aria-label="Share"><i data-lucide="bookmark" data-size="16" data-stroke-width="1.5"></i></agd-button></agd-tooltip>
  <agd-tooltip text="Copy link"><agd-button variant="ghost" icon aria-label="Copy link"><i data-lucide="link" data-size="16" data-stroke-width="1.5"></i></agd-button></agd-tooltip>
  <agd-tooltip text="Download"><agd-button variant="ghost" icon aria-label="Download"><i data-lucide="download" data-size="16" data-stroke-width="1.5"></i></agd-button></agd-tooltip>
  <agd-tooltip text="Hide"><agd-button variant="ghost" icon aria-label="Hide"><i data-lucide="eye-off" data-size="16" data-stroke-width="1.5"></i></agd-button></agd-tooltip>
</div>
