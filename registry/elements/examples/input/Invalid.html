<!-- An invalid field: the hairline turns red and the message says what to do. -->
<div class="flex w-80 max-w-full flex-col gap-2">
  <label for="work-email" class="type-label text-fg-soft">Work email</label>
  <agd-input id="work-email" type="email" value="team@acme" invalid aria-label="Work email" aria-description="Enter an email like team@acme.com."></agd-input>
  <p id="work-email-error" class="type-caption text-fg-danger">Enter an email like team@acme.com.</p>
</div>
