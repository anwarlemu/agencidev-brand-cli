<!-- A field with a line of help under it, and one that says what is wrong. -->
<div class="flex w-80 max-w-full flex-col gap-6">
  <agd-field label="Brand or creator" description="Add any brand or creator in under a minute.">
    <agd-input name="brand" placeholder="Acme"></agd-input>
  </agd-field>
  <agd-field label="Work email" error="Use your work email, such as you@acme.com.">
    <agd-input name="email" type="email" value="acme"></agd-input>
  </agd-field>
</div>
