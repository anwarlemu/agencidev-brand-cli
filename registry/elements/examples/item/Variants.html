<!-- A board in a hairline box with its action, a tighter row on the card's fill, and a plain row. -->
<div class="flex w-full max-w-md flex-col gap-4">
  <agd-item variant="outline" heading="Acme hooks" description="48 creatives from 12 brands, updated today.">
    <i data-lucide="bookmark" slot="media" data-size="20" data-stroke-width="1.5" aria-hidden="true"></i>
    <agd-button slot="actions" variant="secondary" size="sm">Open</agd-button>
  </agd-item>
  <agd-item variant="muted" size="sm" heading="New creatives found" description="12 since your last visit.">
    <i data-lucide="sparkles" slot="media" data-size="16" data-stroke-width="1.5" aria-hidden="true"></i>
    <agd-button slot="actions" variant="ghost" size="sm">Review</agd-button>
  </agd-item>
  <agd-item heading="Weekly digest" description="Every Monday, the ads your rivals started running.">
    <agd-button slot="actions" variant="secondary" size="sm">Turn on</agd-button>
  </agd-item>
</div>
