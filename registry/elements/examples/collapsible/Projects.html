<!-- A list that shows its first projects and opens to the rest, open with the page. -->
<div class="w-100 max-w-full">
  <p class="py-2 type-ui text-fg">Acme onboarding</p>
  <agd-collapsible id="projects-more" open>
    <span slot="trigger" class="contents"><span class="text-fg-muted" data-label>Show fewer projects</span></span>
    <ul class="flex flex-col">
      <li class="py-2 type-ui text-fg">Acme dashboard</li>
      <li class="py-2 type-ui text-fg">Acme mobile app</li>
      <li class="py-2 type-ui text-fg">Acme website</li>
    </ul>
  </agd-collapsible>
</div>
<script type="module">
  const more = document.getElementById('projects-more')
  more.addEventListener('open-change', (e) => {
    more.querySelector('[data-label]').textContent = e.detail.value ? 'Show fewer projects' : 'Show 3 more projects'
  })
</script>
