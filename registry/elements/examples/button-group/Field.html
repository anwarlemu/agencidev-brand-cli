<!-- A field with its button, and a stack of secondary buttons. -->
<div class="flex w-120 max-w-full flex-col items-center gap-6">
  <agd-button-group label="Invite" class="w-full">
    <agd-input aria-label="Email" placeholder="team@acme.com"></agd-input>
    <agd-button>Invite</agd-button>
  </agd-button-group>
  <agd-button-group label="Sort" vertical>
    <agd-button variant="secondary">Newest</agd-button>
    <agd-button variant="secondary">Longest running</agd-button>
    <agd-button variant="secondary">Most engagement</agd-button>
  </agd-button-group>
</div>
