<!-- A results toolbar: paging, the two views, and a share button with its menu arrow, each set joined into one block. -->
<div class="flex flex-wrap items-center justify-center gap-3">
  <agd-button-group label="Pages">
    <agd-button variant="secondary" icon aria-label="Previous page"><i data-lucide="chevron-left" data-size="16" data-stroke-width="1.5" aria-hidden="true"></i></agd-button>
    <agd-button variant="secondary" icon aria-label="Next page"><i data-lucide="chevron-right" data-size="16" data-stroke-width="1.5" aria-hidden="true"></i></agd-button>
  </agd-button-group>
  <agd-button-group label="View">
    <agd-button variant="secondary"><i data-lucide="layout-grid" data-size="16" data-stroke-width="1.5" aria-hidden="true"></i>Grid</agd-button>
    <agd-button variant="secondary"><i data-lucide="rows-3" data-size="16" data-stroke-width="1.5" aria-hidden="true"></i>Rows</agd-button>
  </agd-button-group>
  <agd-button-group label="Share">
    <agd-button variant="secondary">Share</agd-button>
    <agd-button variant="secondary" icon aria-label="Share options"><i data-lucide="chevron-down" data-size="16" data-stroke-width="1.5" aria-hidden="true"></i></agd-button>
  </agd-button-group>
</div>
