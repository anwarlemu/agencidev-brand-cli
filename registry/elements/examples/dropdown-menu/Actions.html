<!-- A project's actions, open with the page: share, copy, download, then archive on its own. -->
<div class="flex h-72 w-full items-start justify-center pt-2">
  <agd-dropdown-menu label="Project actions" open>
    <span slot="trigger" class="contents"><i data-lucide="ellipsis" data-size="16" data-stroke-width="1.5" aria-hidden="true"></i>Actions</span>
    <agd-menu-label>Acme onboarding</agd-menu-label>
    <agd-menu-item><i data-lucide="bookmark" data-size="16" data-stroke-width="1.5" class="shrink-0 text-fg-muted" aria-hidden="true"></i>Share</agd-menu-item>
    <agd-menu-item><i data-lucide="link" data-size="16" data-stroke-width="1.5" class="shrink-0 text-fg-muted" aria-hidden="true"></i>Copy link</agd-menu-item>
    <agd-menu-item><i data-lucide="download" data-size="16" data-stroke-width="1.5" class="shrink-0 text-fg-muted" aria-hidden="true"></i>Download</agd-menu-item>
    <agd-menu-separator></agd-menu-separator>
    <agd-menu-item danger><i data-lucide="flag" data-size="16" data-stroke-width="1.5" class="shrink-0" aria-hidden="true"></i>Archive</agd-menu-item>
  </agd-dropdown-menu>
</div>
