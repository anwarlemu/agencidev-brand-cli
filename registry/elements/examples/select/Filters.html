<!-- Two filters for a search: a discipline to pick (a placeholder until then) and the order, already chosen. -->
<div class="flex min-h-72 w-72 max-w-full flex-col gap-6">
  <div class="flex flex-col gap-2">
    <label for="select-discipline" class="type-label text-fg-soft">Discipline</label>
    <agd-select id="select-discipline" aria-label="Discipline" name="discipline" placeholder="Any discipline" options='[{"value":"product","label":"Product design"},{"value":"brand","label":"Branding"},{"value":"build","label":"Development"},{"value":"hardware","label":"Hardware","disabled":true}]'></agd-select>
  </div>
  <div class="flex flex-col gap-2">
    <label for="select-order" class="type-label text-fg-soft">Sort by</label>
    <agd-select id="select-order" aria-label="Sort by" name="order" value="longest" options='[{"value":"newest","label":"Newest first"},{"value":"longest","label":"Longest running"},{"value":"comments","label":"Most comments"}]'></agd-select>
    <p class="type-caption text-fg-muted">The longest projects first.</p>
  </div>
</div>
