<!-- The shortcuts beside what they do, and a key inside a sentence. -->
<div class="flex w-72 max-w-full flex-col gap-6">
  <dl class="flex flex-col gap-3">
    <div class="flex items-center justify-between gap-4">
      <dt class="type-ui text-fg-soft">Search creatives</dt>
      <dd><agd-kbd-group><agd-kbd>⌘</agd-kbd><agd-kbd>K</agd-kbd></agd-kbd-group></dd>
    </div>
    <div class="flex items-center justify-between gap-4">
      <dt class="type-ui text-fg-soft">Save to a board</dt>
      <dd><agd-kbd-group><agd-kbd>⌘</agd-kbd><agd-kbd>S</agd-kbd></agd-kbd-group></dd>
    </div>
    <div class="flex items-center justify-between gap-4">
      <dt class="type-ui text-fg-soft">Next result</dt>
      <dd><agd-kbd-group><agd-kbd>J</agd-kbd></agd-kbd-group></dd>
    </div>
    <div class="flex items-center justify-between gap-4">
      <dt class="type-ui text-fg-soft">Previous result</dt>
      <dd><agd-kbd-group><agd-kbd>K</agd-kbd></agd-kbd-group></dd>
    </div>
  </dl>
  <p class="type-caption text-fg-muted">Press <agd-kbd>Esc</agd-kbd> to close any panel.</p>
</div>
