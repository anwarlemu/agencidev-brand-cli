<!-- Pick a discipline to filter by: type to narrow the list, arrows to move, Enter to pick. Counts are open projects. -->
<div class="flex h-96 w-72 max-w-full flex-col gap-2">
  <label for="combobox-discipline" class="type-label text-fg-soft">Discipline</label>
  <agd-combobox id="combobox-discipline" value="" label="Discipline" placeholder="Choose a discipline" filter-label="Filter disciplines" match-width></agd-combobox>
  <p id="combobox-discipline-note" class="type-caption text-fg-muted" aria-live="polite">Filter by one discipline at a time.</p>
</div>
<script type="module">
  await customElements.whenDefined('agd-combobox')
  const categories = [
    { value: 'product', label: 'Product design', hint: '12' },
    { value: 'brand', label: 'Branding', hint: '8' },
    { value: 'strategy', label: 'Strategy', hint: '6' },
    { value: 'web', label: 'Web development', hint: '5' },
    { value: 'mobile', label: 'Mobile development', hint: '4' },
    { value: 'systems', label: 'Design systems', hint: '3' },
    { value: 'research', label: 'Research', hint: '2' },
  ]
  const box = document.getElementById('combobox-discipline')
  box.options = categories
  box.addEventListener('change', () => {
    document.getElementById('combobox-discipline-note').textContent = `Showing ${categories.find((c) => c.value === box.value)?.label} projects.`
  })
</script>
